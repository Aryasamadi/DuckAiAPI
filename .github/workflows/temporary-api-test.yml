name: Temporary Runner API Test

on:
  workflow_dispatch:
    inputs:
      tunnel_minutes:
        description: "How long to keep the temporary API tunnel alive (1-350 minutes)"
        required: true
        default: "60"
        type: string

permissions:
  contents: read

jobs:
  run-test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for Duck.ai client
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API, Duck.ai, and test dependencies
        run: |
          pip install -r requirements-api.txt pytest
          npm install --no-save jsdom
          python -m compileall -q api_server.py duck_cli.py duck_i18n.py
          python -m pytest -q

      - name: Validate client token
        env:
          DUCKAI_API_TOKEN: ${{ secrets.DUCKAI_API_TOKEN }}
        run: |
          if [ -z "$DUCKAI_API_TOKEN" ]; then
            echo "::error::Add DUCKAI_API_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Start Duck.ai OpenAI-compatible API
        env:
          DUCKAI_API_TOKEN: ${{ secrets.DUCKAI_API_TOKEN }}
          DUCKAI_MODE: "1"
        run: |
          nohup uvicorn api_server:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Start temporary public tunnel
        run: |
          curl --fail --silent --show-error -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 45); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\\.trycloudflare\\.com' tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "TEMPORARY_API_URL=$URL" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "API base: $URL/v1"
              echo "Health: $URL/health"
              exit 0
            fi
            sleep 2
          done
          cat tunnel.log
          exit 1

      - name: Keep API available
        env:
          TUNNEL_MINUTES: ${{ inputs.tunnel_minutes }}
        run: |
          MINUTES=$(printf '%s' "$TUNNEL_MINUTES" | grep -E '^[0-9]+$' || echo 60)
          if [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 350 ]; then MINUTES=60; fi
          echo "Temporary Duck.ai API will remain available for $MINUTES minute(s)."
          sleep "$((MINUTES * 60))"
